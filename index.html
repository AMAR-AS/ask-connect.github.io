<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripting Battle | Live Tracker</title>
    <style>
        /* Glassmorphism Design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Join the Battle</h2>
    <p>Enter your details to register your points</p>
    
    <input type="text" id="participantName" placeholder="Your Name" required>
    <input type="text" id="teamName" placeholder="Team Name" required>
    <input type="text" id="topic" placeholder="Topic Title" required>
    <input type="number" id="points" placeholder="Points" value="10">
    
    <button onclick="submitToGoogle()">Submit Entry</button>
    <div id="status"></div>
</div>

<script>
    // --- UPDATED CONFIGURATION WITH YOUR IDS ---
    const FORM_ID = "1FAIpQLScA0rkdfJ9nSYYN5i9tn4xn_7Y-tcW2pkRLodEWSIBRY0SyQg";
    const ENTRY_IDS = {
        name: "entry.871428446",
        team: "entry.1623041267",
        topic: "entry.1569986237",
        point: "entry.1509555108"
    };

    async function submitToGoogle() {
        const statusDiv = document.getElementById('status');
        const name = document.getElementById('participantName').value;
        const team = document.getElementById('teamName').value;
        const topic = document.getElementById('topic').value;
        const point = document.getElementById('points').value;

        if (!name || !team || !topic) {
            statusDiv.innerText = "❌ Please fill all fields!";
            return;
        }

        statusDiv.innerText = "⏳ Sending to battle logs...";

        // Construct the Google Form submission URL
        const formUrl = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;
        
        // Use URLSearchParams to format data correctly for Google
        const formData = new URLSearchParams();
        formData.append(ENTRY_IDS.name, name);
        formData.append(ENTRY_IDS.team, team);
        formData.append(ENTRY_IDS.topic, topic);
        formData.append(ENTRY_IDS.point, point);

        try {
            await fetch(formUrl, {
                method: 'POST',
                mode: 'no-cors', // Crucial for Google Forms
                body: formData
            });

            // Since mode is 'no-cors', we won't get a 'success' response back,
            // but the data will still be sent to the sheet.
            statusDiv.innerText = "✅ Entry Submitted! Check the Sheet.";
            
            // Optional: Clear fields after 2 seconds
            setTimeout(() => {
                document.getElementById('participantName').value = "";
                statusDiv.innerText = "";
            }, 2000);

        } catch (error) {
            console.error('Error!', error);
            statusDiv.innerText = "❌ Connection Error.";
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS vs TS: Live Master Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --js: #f7df1e; --ts: #3178c6; --bg: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .container { background: #1e293b; padding: 2rem; border-radius: 25px; width: 90%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .hidden { display: none; }
        #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 12px; margin: 20px 0; }
        .card { border-top: 15px solid; padding: 30px; border-radius: 15px; background: rgba(255,255,255,0.03); }
        .js-team { border-color: var(--js); }
        .ts-team { border-color: var(--ts); }
        .topic-name { font-size: 1.6rem; font-weight: 800; margin: 15px 0; }
        .instruction { font-size: 1.1rem; padding: 12px; background: rgba(56, 189, 248, 0.1); border-radius: 8px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="host-view">
        <h1 style="margin:0">Scripting Battle</h1>
        <p style="color: #94a3b8;">Scanning Live Tracker</p>
        <div id="qrcode"></div>
        <p style="font-size: 0.8rem; color: #475569;"></p>
    </div>

    <div id="user-view" class="hidden">
        <div id="role-card" class="card">
            <div id="user-label" style="text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin-bottom: 5px;"></div>
            <h1 id="team-label" style="margin-top:0; font-size: 2.2rem;"></h1>
            <div id="point-title" class="topic-name"></div>
            <div id="point-desc" class="instruction"></div>
        </div>
    </div>
</div>

<script>
// --- MASTER CONFIGURATION ---
const FORM_ID = "1ebulLmAvVkMvACnhGZJGQbXQObgwLTZw3isPupEY6Og"; 
const ENTRY_IDS = {
    name: "entry.1775554771",  
    team: "entry.296101000",   
    topic: "entry.1775554772", 
    point: "entry.1775554773"  
};

const SESSION_ID = "battle_v1"; // Change to 'v2' to reset all users
const FORM_URL = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;

const topics = [
    { t: "Type System", js: "Dynamic", ts: "Static" },
    { t: "Superset Relationship", js: "Base", ts: "Extension" },
    { t: "Variable Reassignment", js: "Flexible", ts: "Strict" },
    { t: "Abstract Classes", js: "Prototypal", ts: "Structural" },
    { t: "Type Inference", js: "None", ts: "Advanced" },
    { t: "Superset Definition", js: "Core", ts: "Syntactic" },
    { t: "Interfaces", js: "Duck typing", ts: "Explicit contracts" },
    { t: "Enums", js: "Manual", ts: "Native" },
    { t: "Generics", js: "Absent", ts: "Full <T>" },
    { t: "Optional Parameters", js: "Implicit", ts: "Explicit ?" },
    { t: "Function Overloading", js: "Logic-based", ts: "Signature-based" },
    { t: "Access Modifiers", js: "Conventions", ts: "private/protected" },
    { t: "Union Types", js: "No", ts: "| and &" },
    { t: "Tuples", js: "Arrays", ts: "Strict pairs" },
    { t: "Decorators", js: "Proposal", ts: "Experimental" },
    { t: "Error Detection", js: "Runtime", ts: "Compile-time" },
    { t: "IDE Support", js: "Basic", ts: "Rich" },
    { t: "Refactoring", js: "Manual", ts: "Automated" },
    { t: "Learning Curve", js: "Easy", ts: "Moderate" },
    { t: "Documentation", js: "JSDoc", ts: "Self-documenting" },
    { t: "Null Safety", js: "Permissive", ts: "Strict" },
    { t: "Velocity", js: "Initial speed", ts: "Scalability" },
    { t: "Compilation", js: "Native", ts: "Transpilation" },
    { t: "Libraries", js: "Raw", ts: "@types" },
    { t: "Scale", js: "Small", ts: "Enterprise" },
    { t: "Browser Support", js: "Universal", ts: "Target-based" },
    { t: "Configuration", js: "Minimal", ts: "tsconfig" }
];

document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    
    if (params.has('join')) {
        document.getElementById('host-view').classList.add('hidden');
        document.getElementById('user-view').classList.remove('hidden');

        let name = localStorage.getItem("battle_name");
        if (!name) {
            name = prompt("Enter your Name for the battle:");
            if (!name) name = "User_" + Math.floor(Math.random() * 99);
            localStorage.setItem("battle_name", name);
        }

        let slot = localStorage.getItem(SESSION_ID);
        if (!slot) {
            slot = Math.floor(Math.random() * 54);
            localStorage.setItem(SESSION_ID, slot);

            // Assignment Data
            const isTS = slot >= 27;
            const idx = isTS ? slot - 27 : slot;
            const team = isTS ? "TS" : "JS";
            const topic = topics[idx];

            // Submit to Google Sheets
            const body = new URLSearchParams();
            body.append(ENTRY_IDS.name, name);
            body.append(ENTRY_IDS.team, team);
            body.append(ENTRY_IDS.topic, topic.t);
            body.append(ENTRY_IDS.point, idx + 1);

            fetch(FORM_URL, { method: "POST", mode: "no-cors", body: body });
        }

        render(parseInt(slot), name);
    } else {
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href + "?join=true",
            width: 250, height: 250
        });
    }
});

function render(slot, name) {
    const isTS = slot >= 27;
    const idx = isTS ? slot - 27 : slot;
    const topic = topics[idx];
    document.getElementById('user-label').innerText = name;
    document.getElementById('team-label').innerText = "TEAM " + (isTS ? "TYPESCRIPT" : "JAVASCRIPT");
    document.getElementById('point-title').innerText = topic.t;
    document.getElementById('point-desc').innerText = "ARGUMENT: " + (isTS ? topic.ts : topic.js);
    document.getElementById('role-card').className = "card " + (isTS ? "ts-team" : "js-team");
}
</script>
    <footer>All Rights Reserved</footer>
</body>
</html>

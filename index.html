<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS vs TS: Expert Battle Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --js: #f7df1e; --ts: #3178c6; --bg: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .container { background: #1e293b; padding: 2.5rem; border-radius: 25px; width: 90%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .hidden { display: none; }
        #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 15px; margin: 20px 0; border: 5px solid #38bdf8; }
        .session-tag { background: #38bdf8; color: #0f172a; font-size: 0.7rem; padding: 4px 12px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; display: inline-block; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; background: #0f172a; color: white; box-sizing: border-box; text-align: center; font-size: 1rem; border: 1px solid #334155; }
        button { width: 100%; background: #22c55e; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
        button:hover { background: #16a34a; transform: translateY(-2px); }
        .card { border-top: 12px solid; padding: 30px; border-radius: 15px; background: rgba(255,255,255,0.05); transition: 0.5s; }
        .js-team { border-color: var(--js); color: var(--js); }
        .ts-team { border-color: var(--ts); color: var(--ts); }
        .topic-name { font-size: 1.6rem; font-weight: 800; margin: 15px 0; color: white; }
        .instruction { font-size: 1.1rem; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px; margin-top: 20px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <div id="session-label" class="session-tag"></div>

    <div id="host-view">
        <h1 style="margin:0">Battle Master</h1>
        <p style="color: #94a3b8;">Scanning for Battle Assignments</p>
        <div id="qrcode"></div>
        <div style="font-size: 0.8rem; color: #475569;">Project this on the main screen</div>
    </div>

    <div id="entry-view" class="hidden">
        <h1>Identify Expert</h1>
        <p>Enter your name to receive your role.</p>
        <input type="text" id="expertName" placeholder="Full Name" autocomplete="off">
        <button onclick="assignAndSubmit()">JOIN BATTLE</button>
    </div>

    <div id="participant-view" class="hidden">
        <div id="assignment-card" class="card">
            <h1 id="team-display" style="margin-top:0; font-size: 2rem;">TEAM</h1>
            <div id="point-id" style="font-size: 0.8rem; letter-spacing: 2px; opacity: 0.6; color: white;"></div>
            <div class="topic-name" id="point-title"></div>
            <div class="instruction" id="point-desc"></div>
        </div>
        <p style="margin-top: 25px; font-size: 0.6rem; opacity: 0.4;">FINGERPRINT: <span id="res-fp"></span></p>
    </div>
</div>

<script>
// --- CONFIGURATION ---
const SESSION_ID = "battle_round_1"; // Change to "battle_round_2", etc. for new groups
const FORM_ID = "1FAIpQLScA0rkdfJ9nSYYN5i9tn4xn_7Y-tcW2pkRLodEWSIBRY0SyQg";
const ENTRY_IDS = {
    name: "entry.871428446",
    team: "entry.1623041267",
    session: "entry.1569986237",
    fingerprint: "entry.1509555108"
};

const comparisonPoints = [
    { t: "Type System", js: "Dynamic", ts: "Static" },
    { t: "Superset Relationship", js: "Base language", ts: "Extension" },
    { t: "Variable Reassignment", js: "Flexible", ts: "Strict" },
    { t: "Abstract Classes", js: "Prototypal", ts: "Structural" },
    { t: "Type Inference", js: "None", ts: "Advanced" },
    { t: "Superset Definition", js: "Core", ts: "Syntactic Superset" },
    { t: "Interfaces", js: "Implicit/Duck typing", ts: "Explicit contracts" },
    { t: "Enums", js: "Manual objects", ts: "Native keyword" },
    { t: "Generics", js: "Absent", ts: "Full <T> support" },
    { t: "Optional Parameters", js: "Implicitly undefined", ts: "Explicit ?" },
    { t: "Function Overloading", js: "Logic-based", ts: "Signature-based" },
    { t: "Access Modifiers", js: "Naming conventions", ts: "private/protected" },
    { t: "Union/Intersection Types", js: "Not supported", ts: "| and & types" },
    { t: "Tuples", js: "Standard arrays", ts: "Strict positional pairs" },
    { t: "Decorators", js: "Stage 3 proposal", ts: "Legacy support" },
    { t: "Error Detection", js: "Runtime", ts: "Compile-time" },
    { t: "IntelliSense/IDE Support", js: "Basic heuristics", ts: "Rich definitions" },
    { t: "Code Refactoring", js: "Risky/Manual", ts: "Safe/Automated" },
    { t: "Learning Curve", js: "Low/Easy", ts: "Moderate/Type-heavy" },
    { t: "Code Documentation", js: "Manual/JSDoc", ts: "Inherent/Self-documenting" },
    { t: "Null/Undefined Safety", js: "Permissive", ts: "Strict checks" },
    { t: "Maintenance & Velocity", js: "Initial speed", ts: "Long-term scalability" },
    { t: "Compilation & Build", js: "Native browser", ts: "Transpilation" },
    { t: "Ecosystem & Libraries", js: "Original source", ts: "Typed wrappers" },
    { t: "Project Scale", js: "Small/Prototypes", ts: "Large/Enterprise" },
    { t: "Browser Support", js: "Universal", ts: "Target-based" },
    { t: "Tooling Configuration", js: "Minimal", ts: "tsconfig.json" }
];

function getFingerprint() {
    const info = [navigator.userAgent, screen.width, screen.height].join('|');
    let hash = 0;
    for (let i = 0; i < info.length; i++) {
        hash = ((hash << 5) - hash) + info.charCodeAt(i);
        hash |= 0;
    }
    return Math.abs(hash);
}

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('session-label').innerText = SESSION_ID;
    const urlParams = new URLSearchParams(window.location.search);
    
    // RESET PROTOCOL: Clear old data if session name changed
    if (localStorage.getItem("active_session") !== SESSION_ID) {
        localStorage.clear();
        localStorage.setItem("active_session", SESSION_ID);
    }

    if (urlParams.has('join')) {
        document.getElementById('host-view').classList.add('hidden');
        if (localStorage.getItem("userName")) {
            showAssignment();
        } else {
            document.getElementById('entry-view').classList.remove('hidden');
        }
    } else {
        // Generate QR for the current URL
        const scanUrl = window.location.href + (window.location.href.includes('?') ? '&' : '?') + 'join=true';
        new QRCode(document.getElementById("qrcode"), { text: scanUrl, width: 250, height: 250 });
    }
});

async function assignAndSubmit() {
    const name = document.getElementById('expertName').value.trim();
    if (!name) return alert("Please enter your name!");

    const hash = getFingerprint();
    // LOAD BALANCER: Perfectly splits 54 people into 2 teams and 27 topics
    const slot = hash % 54; 
    const isTS = slot >= 27;
    const topicIdx = isTS ? slot - 27 : slot;
    const team = isTS ? "TEAM TYPESCRIPT" : "TEAM JAVASCRIPT";

    localStorage.setItem("userName", name);
    localStorage.setItem("userSlot", slot);

    // BACKGROUND SYNC: Send to Google Form
    const formData = new URLSearchParams();
    formData.append(ENTRY_IDS.name, name);
    formData.append(ENTRY_IDS.team, team);
    formData.append(ENTRY_IDS.session, SESSION_ID);
    formData.append(ENTRY_IDS.fingerprint, `${hash} | Slot ${slot}`);

    fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`, {
        method: 'POST', mode: 'no-cors', body: formData
    });

    showAssignment();
}

function showAssignment() {
    document.getElementById('entry-view').classList.add('hidden');
    document.getElementById('participant-view').classList.remove('hidden');

    const slot = parseInt(localStorage.getItem("userSlot"));
    const isTS = slot >= 27;
    const topicIdx = isTS ? slot - 27 : slot;
    const topic = comparisonPoints[topicIdx];

    const card = document.getElementById('assignment-card');
    document.getElementById('team-display').innerText = isTS ? "TEAM TYPESCRIPT" : "TEAM JAVASCRIPT";
    card.classList.add(isTS ? 'ts-team' : 'js-team');
    
    document.getElementById('point-id').innerText = `ARGUMENT POINT #${topicIdx + 1}`;
    document.getElementById('point-title').innerText = topic.t;
    document.getElementById('point-desc').innerText = `DEFEND: ${isTS ? topic.ts : topic.js}`;
    document.getElementById('res-fp').innerText = getFingerprint();
}
</script>
</body>
</html>
